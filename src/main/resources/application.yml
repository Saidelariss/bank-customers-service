spring.application.name: bank-customers-service
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_customers
    username: bank
    password: bank
    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate.jdbc.time_zone: UTC
    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.xml
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
